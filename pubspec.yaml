name: smishing_guard
description: Android prototype for smishing URL detection with overlay warnings.
publish_to: "none"
version: 0.4.18+36

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: 1.2.2
  shared_preferences: 2.2.3
  permission_handler: 11.3.1
  url_launcher: 6.3.1
  flutter_secure_storage: 9.2.2
  package_info_plus: 8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/guard_shield.png
