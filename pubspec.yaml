publish_to: "none"
version: 0.1.7+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: 1.2.2
  shared_preferences: 2.2.3
  permission_handler: 11.3.1
  url_launcher: 6.3.1
  flutter_secure_storage: 9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
